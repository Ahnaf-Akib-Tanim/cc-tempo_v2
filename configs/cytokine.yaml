inherit: base.yaml
name: cytokine
paths:
  raw: raw/weinreb_cytokine
  work: work/cytokine
  h5ad: work/cytokine/cytokine_log.h5ad
  liana: work/cytokine/liana_table.csv.gz
  data_pt: work/cytokine/data.pt
  runs: work/cytokine/runs
  results: work/cytokine/results

prepare:
  kind: cytokine
  time_key: Time point
  celltype_key: Cell type annotation
  condition_key: Cytokine condition
  n_hvg: 2500
  n_pcs: 50
  val_frac: 0.1
  liana_methods: [rank_aggregate]
  liana_resource: mouseconsensus
  liana_max_cells_per_group: 1500
  lr_top_k: 128
  lr_method: rank_aggregate
  force_cytokines: [M-csf, G-csf, Epo, SCF, IL-3, IL-6, TPO, Flt3L, IL-11, IL-5]

train:
  start_time: 2.0
  train_times: [4.0, 6.0]
  start_condition: null          # Day-2 cells are shared (all labelled 'full cocktail' before replating)
  conditions: [full cocktail, M-csf, G-csf, Epo, SCF]
  # Weinreb et al. 2020, Supp Methods 2.5 and 8.1: StemSpan + IL-3 20, FLT3-L 50, IL-11 50, IL-5 10,
  # TPO 50, mSCF 50, IL-6 10 ng/mL and EPO 3 U/mL (no GM-/M-/G-CSF). On day 2 the cells were re-plated in
  # the same cocktail, M-CSF 20 ng/mL, G-CSF 20 ng/mL or EPO 3 U/mL (each in StemSpan). The 'SCF' arm is in
  # the GEO metadata (Day 4 only) but not described in the paper.
  condition_cytokines:
    full cocktail: [IL-3, Flt3L, IL-11, IL-5, TPO, SCF, IL-6, Epo]
    M-csf: [M-csf]
    G-csf: [G-csf]
    Epo: [Epo]
    SCF: [SCF]

eval:
  start_time: 2.0
  end_time: 6.0
  pos: Neu
  neg: Mo
  undiff: Undifferentiated
  conditions: [full cocktail, M-csf, G-csf, Epo, SCF]
